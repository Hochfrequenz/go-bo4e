name: golangci-lint
on:
  pull_request:
jobs:
  golangci:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: actions/checkout@v7
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      - name: fmt
        run: golangci-lint fmt --diff --enable gofmt
